<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Recipe Finder</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container"></div>
    <h1>🍽️ AI Recipe Finder</h1>

    <div class="input-wrapper">
        <input type="text" id="searchInput" placeholder="Search by ingredients...">
        <div class="buttons">
            <button id="micBtn">🎤</button>
            <button id="searchBtn">🔍</button>
        </div>
    </div>

    <div id="results"></div>

    <div id="recipeDescription" style="display:none; margin-top:30px;">
        <h2>How to Make This Recipe</h2>
        <ol id="recipeSteps">
            <!-- Steps will be dynamically inserted here -->
        </ol>
    </div>
</div>

<script src="scritp.js"></script>
<style>
    body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(-45deg, #ffecd2, #fcb69f, #a1c4fd, #c2e9fb);
        background-size: 400% 400%;
        animation: gradientBG 12s ease infinite;
    }
    @keyframes gradientBG {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }
</style>
</body>
</html>
